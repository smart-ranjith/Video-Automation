name: Autonomous YouTube Shorts Factory

# This triggers the workflow automatically every day, and allows manual button clicks
on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC (Adjust to your preferred posting time)
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

permissions:
  contents: write # Required to create GitHub Releases and commit memory files

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Highly stable version for MoviePy and APIs

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installing all the exact libraries your generator.py script requires
          pip install pillow numpy python-dotenv requests google-api-python-client google-auth-oauthlib google-genai edge-tts moviepy==1.0.3

      - name: Run the Media Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generator.py
          
      - name: Save AI Memory State
        # This guarantees the Cliffhanger Engine and Topic Memory persist across daily runs
        run: |
          git config --global user.name "Automation Bot"
          git config --global user.email "actions@github.com"
          git add topic_history.json cliffhanger.json viewer_requests.json || true
          git commit -m "Auto-update memory and cliffhanger context [skip ci]" || echo "No changes to commit"
          git push
