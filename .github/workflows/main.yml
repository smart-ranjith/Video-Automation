name: Daily YouTube Shorts Automator

on:
  schedule:
    - cron: '0 */6 * * *' # Triggers at 00:00, 06:00, 12:00, and 18:00 UTC 
  workflow_dispatch: # Allows manual testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Requirements (for MoviePy)
        run: sudo apt-get install -y imagemagick

      - name: Install and Run Everything
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 moviepy==1.0.3 pillow==9.5.0 edge-tts google-genai requests
          python generator.py
