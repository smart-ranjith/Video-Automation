name: Autonomous YouTube Shorts Factory

on:
  schedule:
    - cron: '0 12 * * *' 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Added imageio-ffmpeg to bundle FFmpeg directly in Python
          pip install pillow numpy python-dotenv requests google-api-python-client google-auth-oauthlib google-genai edge-tts moviepy==1.0.3 imageio-ffmpeg

      - name: Run the Media Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generator.py
          
      - name: Save AI Memory State
        run: |
          git config --global user.name "Automation Bot"
          git config --global user.email "actions@github.com"
          git add topic_history.json cliffhanger.json viewer_requests.json || true
          git commit -m "Auto-update memory and cliffhanger context [skip ci]" || echo "No changes to commit"
          git push
