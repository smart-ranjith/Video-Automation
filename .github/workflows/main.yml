name: Daily YouTube Shorts Automator

on:
  schedule:
    # Runs at 10:00 AM IST (04:30 UTC) every single day. 
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows you to trigger it manually via a button on GitHub

permissions:
  contents: write # Required so the bot can save its memory (topic_history.json)

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-dejavu

    - name: Fix ImageMagick Policy for MoviePy
      run: |
        # MoviePy needs ImageMagick to have read/write permissions for text generation
        sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Video Generator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}
      run: |
        python generator.py

    - name: Save AI Memory (Commit Topic History)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add topic_history.json
        git commit -m "🤖 Auto-update AI topic memory [skip ci]" || echo "No changes to commit"
        git push
