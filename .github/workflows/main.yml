name: Daily YouTube Shorts Automator

on:
  schedule:
    - cron: '0 14 * * *' # Runs at 14:00 UTC every day
  workflow_dispatch: # This adds a button so you can trigger it manually anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Requirements (for MoviePy)
        run: sudo apt-get install -y imagemagick

      - name: Install and Run Everything
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 moviepy edge-tts google-genai requests
          python generator.py
