name: Weekly YouTube Dashboard Analysis & Strategy Update

on:
  schedule:
    # Runs once every week: Sunday 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * 0'
  workflow_dispatch:        # manual trigger anytime for testing or on-demand audit

permissions:
  contents: write           # commit updated channel_strategy.json / performance_report.json
  actions: write            # dispatch main.yml automatically when a breakout winner triggers

jobs:
  analyze-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lightweight Analytics Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests python-dotenv

      - name: Run Weekly YouTube Dashboard Audit
        id: analyze
        env:
          CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python analytics_engine.py --weekly 2>&1 | tee weekly_analysis.log

      - name: Commit Updated Strategy & Dashboard Reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_strategy.json performance_report.json viewer_requests.json weekly_analysis.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(analytics): update weekly YouTube dashboard strategy [skip ci]"
          git push || echo "Nothing to push"

      - name: Trigger Bonus Video Run on Breakout Winner
        if: steps.analyze.outputs.breakout_trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Breakout winner detected! Dispatching bonus video generation workflow..."
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches" \
            -d '{"ref":"main"}'
